<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Vokabeln</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
main{max-width:560px;margin:auto;padding:20px 16px 35px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:25px;margin:0}
select,input,button{font:inherit}
select,input{border:1px solid #ccc;border-radius:12px;padding:12px;background:#fff}
select{padding:9px}
button{border:0;border-radius:14px;padding:14px 18px;font-weight:600}
.primary{background:#111;color:#fff}
.secondary{background:#eee;color:#111}
.card{border:1px solid #e3e3e3;border-radius:22px;padding:24px;margin-bottom:16px}
.flash{min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.small{font-size:13px;color:#777}
.word{font-size:42px;font-weight:700;margin:20px 0}
.answer{font-size:32px;font-weight:600;margin:12px 0 22px}
.actions{display:flex;gap:10px;width:100%;margin-top:16px}
.actions button{flex:1}
.good{background:#e3f5e9;color:#126b34}
.bad{background:#fde5e5;color:#9d2020}
.hidden{display:none}
.nav{display:flex;gap:8px;margin-bottom:16px}
.nav button{flex:1;padding:10px}
.nav .active{background:#111;color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:#666;margin-bottom:5px}
.field input{width:100%}
.listrow{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #eee}
.listrow:last-child{border-bottom:0}
.delete{padding:8px 10px}
</style>
</head>
<body>
<main>
<header>
<h1>Vokabeln</h1>
<select id="profile">
<option>Andi</option><option>Tochter</option>
</select>
</header>

<div class="nav">
<button class="active" data-page="learn">Lernen</button>
<button data-page="add">Vokabeln</button>
</div>

<section id="learn">
<div class="card">
<div class="small" id="direction"></div>
<div class="flash">
<div class="word" id="question">Noch keine Vokabeln</div>
<div id="answerArea" class="hidden">
<div class="small">Antwort</div>
<div class="answer" id="answer"></div>
</div>
<button class="primary" id="reveal">Antwort zeigen</button>
<div class="actions hidden" id="actions">
<button class="bad" id="no">Nicht gewusst</button>
<button class="good" id="yes">Gewusst</button>
</div>
</div>
</div>
</section>

<section id="add" class="hidden">
<div class="card">
<div class="field"><label>Deutsch</label><input id="de" autocomplete="off" placeholder="Haus"></div>
<div class="field"><label>Englisch</label><input id="en" autocomplete="off" placeholder="house"></div>
<button class="primary" id="save">Speichern</button>
</div>
<div class="card">
<div class="small" style="margin-bottom:8px">Deine Vokabeln</div>
<div id="list"></div>
</div>
</section>
</main>

<script>
const KEY="simple_vocab_1";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{Andi:[],Tochter:[]};
let currentProfile="Andi", current=null;

function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function words(){return db[currentProfile]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function nextCard(){
 let a=words();
 if(!a.length){
   current=null;
   document.getElementById("question").textContent="Noch keine Vokabeln";
   document.getElementById("direction").textContent="";
   document.getElementById("reveal").classList.add("hidden");
   document.getElementById("answerArea").classList.add("hidden");
   document.getElementById("actions").classList.add("hidden");
   return;
 }
 // Nicht gewusste Karten werden bevorzugt wiederholt.
 let due=a.filter(x=>(x.repeatUntil||0)<=Date.now());
 if(!due.length) due=a;
 due.sort((a,b)=>(a.level||0)-(b.level||0));
 current=due[Math.floor(Math.random()*Math.min(3,due.length))];
 current.reverse=Math.random()<.5;
 document.getElementById("direction").textContent=current.reverse?"Englisch → Deutsch":"Deutsch → Englisch";
 document.getElementById("question").textContent=current.reverse?current.en:current.de;
 document.getElementById("answer").textContent=current.reverse?current.de:current.en;
 document.getElementById("answerArea").classList.add("hidden");
 document.getElementById("reveal").classList.remove("hidden");
 document.getElementById("actions").classList.add("hidden");
}

function rate(ok){
 if(!current)return;
 if(ok){
   current.level=Math.min(5,(current.level||0)+1);
   // Gewusste Wörter kommen später wieder.
   const wait=[0,60000,300000,1800000,7200000,86400000][current.level];
   current.repeatUntil=Date.now()+wait;
 }else{
   current.level=0;
   // Nicht gewusste Wörter kommen direkt wieder.
   current.repeatUntil=0;
 }
 saveDB();
 nextCard();
}

document.getElementById("reveal").onclick=()=>{
 document.getElementById("answerArea").classList.remove("hidden");
 document.getElementById("reveal").classList.add("hidden");
 document.getElementById("actions").classList.remove("hidden");
};
document.getElementById("yes").onclick=()=>rate(true);
document.getElementById("no").onclick=()=>rate(false);

document.getElementById("profile").onchange=e=>{
 currentProfile=e.target.value; renderList(); nextCard();
};

document.getElementById("save").onclick=()=>{
 const de=document.getElementById("de").value.trim();
 const en=document.getElementById("en").value.trim();
 if(!de||!en)return;
 words().push({id:Date.now()+Math.random(),de,en,level:0,repeatUntil:0});
 document.getElementById("de").value="";
 document.getElementById("en").value="";
 saveDB(); renderList(); nextCard();
};

function renderList(){
 const box=document.getElementById("list"); box.innerHTML="";
 if(!words().length){box.innerHTML='<div class="small">Noch keine Vokabeln.</div>';return}
 words().forEach(w=>{
   const row=document.createElement("div");row.className="listrow";
   row.innerHTML="<div>"+esc(w.de)+" → "+esc(w.en)+"</div>";
   const b=document.createElement("button");b.className="secondary delete";b.textContent="Löschen";
   b.onclick=()=>{db[currentProfile]=words().filter(x=>x.id!==w.id);saveDB();renderList();nextCard()};
   row.appendChild(b);box.appendChild(row);
 });
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
 document.getElementById("learn").classList.toggle("hidden",b.dataset.page!=="learn");
 document.getElementById("add").classList.toggle("hidden",b.dataset.page!=="add");
});

renderList();nextCard();
</script>
</body>
</html>
