<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Deutsch ↔ Englisch Vokabeln</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:680px;margin:auto;padding:18px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
h1{font-size:26px;margin:0}
h2{font-size:20px;margin:0 0 12px}
button,input,select{font:inherit}
button{border:0;border-radius:14px;padding:12px 15px;font-weight:600;cursor:pointer}
.primary{background:#111;color:#fff}
.secondary{background:#e5e5ea;color:#111}
.profileBox{display:flex;gap:7px;align-items:center}
.profileBox select{width:auto;min-width:115px}
.profileBtn{padding:11px 12px;white-space:nowrap}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 3px 18px #0000000d;margin-bottom:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow:auto}
.tabs button{white-space:nowrap}
.tabs .active{background:#111;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#f0f0f5;border-radius:16px;padding:13px;text-align:center}
.stat b{display:block;font-size:23px}
.stat span{font-size:12px;color:#666}
label{display:block;font-size:13px;color:#666;margin:10px 0 5px}
input,select{width:100%;padding:13px;border:1px solid #d5d5da;border-radius:13px;background:#fff}
.small{font-size:13px;color:#666}
.flash{min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:22px;background:#fafafa;border:1px solid #eee;padding:25px}
.word{font-size:42px;font-weight:700;margin:12px 0}
.answer{font-size:32px;color:#555;margin:10px 0}
.hidden{display:none!important}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1}
.good{background:#dff7e7;color:#146b37}
.bad{background:#ffe1e1;color:#9b1c1c}
.list{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee;gap:10px}
.list:last-child{border:0}
.list button{padding:9px 11px}
.typingArea{width:100%;max-width:480px;margin-top:18px}
.typingArea input{font-size:20px;text-align:center;margin-bottom:9px}
.feedback{min-height:28px;margin:9px 0;font-weight:700}
.correct{color:#146b37}
.wrong{color:#9b1c1c}
.manage{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.notice{padding:12px 14px;border-radius:12px;background:#f0f0f5;margin-top:12px}
footer{text-align:center;color:#888;font-size:12px;margin-top:22px}
@media(max-width:420px){.word{font-size:34px}.answer{font-size:27px}.profileBox select{min-width:100px}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Vokabeln</h1>
  <div class="profileBox">
    <select id="profile"></select>
    <button class="secondary profileBtn" id="addProfile">+ Profil</button>
  </div>
</header>

<div class="tabs">
  <button class="active" data-tab="learn">Lernen</button>
  <button data-tab="add">Vokabel hinzufügen</button>
  <button data-tab="words">Meine Wörter</button>
</div>

<section id="learn">
  <div class="card">
    <div class="stats">
      <div class="stat"><b id="total">0</b><span>Vokabeln</span></div>
      <div class="stat"><b id="due">0</b><span>heute fällig</span></div>
      <div class="stat"><b id="mastered">0</b><span>gut gelernt</span></div>
    </div>
  </div>

  <div class="card">
    <div class="small" id="direction"></div>
    <div class="flash">
      <div class="small">Was heißt:</div>
      <div class="word" id="question">Noch keine Vokabeln</div>

      <div id="typingArea" class="typingArea hidden">
        <input id="answerInput" type="text" autocomplete="off" autocapitalize="none"
               spellcheck="false" placeholder="Englische Antwort eingeben">
        <button class="primary" id="checkAnswer">Prüfen</button>
        <div id="answerFeedback" class="feedback"></div>
        <div id="correctAnswer" class="answer hidden"></div>
      </div>

      <div id="finishedArea" class="hidden">
        <div class="word">🎉 Alles gelernt!</div>
        <p class="small">Im Moment ist keine Vokabel fällig.</p>
        <button class="secondary" id="repeatAll">Alle nochmal üben</button>
      </div>
    </div>
  </div>
</section>

<section id="add" class="hidden">
  <div class="card">
    <h2>Neue Vokabel</h2>
    <label>Deutsch</label>
    <input id="de" placeholder="z. B. Haus">
    <label>Englisch</label>
    <input id="en" placeholder="z. B. house">
    <div style="height:8px"></div>
    <button class="primary" id="addBtn">Vokabel speichern</button>
    <p class="small">Jedes Profil hat eigene Vokabeln und einen eigenen Lernstand. Die Daten bleiben auf diesem Gerät.</p>
  </div>
</section>

<section id="words" class="hidden">
  <div class="card">
    <h2>Meine Wörter</h2>
    <div id="wordList"></div>
  </div>
</section>

<footer>Private App • Deutsch ↔ Englisch</footer>
</div>

<script>
const KEY="andi_vocab_v1";
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{
  profiles:{
    Andi:[],
    Tochter:[]
  },
  current:"Andi"
};
let current=null;
let checked=false;

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function profile(){return data.profiles[data.current]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function days(n){return Date.now()+n*86400000}
function dueCards(){return profile().filter(x=>(x.next||0)<=Date.now())}

function renderProfiles(){
  const s=document.getElementById("profile");
  s.innerHTML="";
  Object.keys(data.profiles).forEach(p=>{
    const o=document.createElement("option");
    o.value=p;o.textContent=p;s.appendChild(o);
  });
  if(!data.profiles[data.current]) data.current=Object.keys(data.profiles)[0];
  s.value=data.current;
}

function addProfile(){
  const name=prompt("Name für das neue Profil:");
  if(name===null)return;
  const n=name.trim();
  if(!n){alert("Bitte einen Namen eingeben.");return}
  if(n.length>30){alert("Der Name darf höchstens 30 Zeichen haben.");return}
  if(data.profiles[n]){alert("Dieses Profil gibt es bereits.");return}

  const pin=prompt("Bitte einen 4-stelligen PIN für dieses Profil festlegen.\nDer PIN wird nur auf diesem Gerät gespeichert.");
  if(pin===null)return;
  if(!/^\d{4}$/.test(pin)){alert("Der PIN muss genau 4 Ziffern haben.");return}

  data.profiles[n]=[];
  if(!data.profilePins)data.profilePins={};
  data.profilePins[n]=pin;
  data.current=n;
  save();renderProfiles();renderStats();pick();
}

function renderStats(){
  const a=profile(),due=dueCards();
  document.getElementById("total").textContent=a.length;
  document.getElementById("due").textContent=due.length;
  document.getElementById("mastered").textContent=a.filter(x=>x.level>=4).length;
}

function pick(){
  const a=dueCards();
  current=null;
  checked=false;

  const typing=document.getElementById("typingArea");
  const finished=document.getElementById("finishedArea");
  const input=document.getElementById("answerInput");
  const feedback=document.getElementById("answerFeedback");
  const correct=document.getElementById("correctAnswer");

  // Ergebnis-Buttons des vorherigen Wortes entfernen.
  const oldActions=document.getElementById("resultActions");
  if(oldActions) oldActions.remove();

  const oldNext=document.getElementById("nextButton");
  if(oldNext) oldNext.remove();

  typing.classList.add("hidden");
  finished.classList.add("hidden");
  feedback.textContent="";
  feedback.className="feedback";
  correct.textContent="";
  correct.classList.add("hidden");
  input.value="";
  input.disabled=false;
  document.getElementById("checkAnswer").classList.remove("hidden");

  if(!a.length){
    document.getElementById("direction").textContent="";
    document.getElementById("question").classList.add("hidden");
    finished.classList.remove("hidden");
    return;
  }

  document.getElementById("question").classList.remove("hidden");

  // Schwierige Wörter zuerst, innerhalb derselben Stufe zufällig.
  a.sort((x,y)=>(x.level||0)-(y.level||0) || Math.random()-.5);
  current=a[0];

  // Schreiben üben: Standardmäßig Deutsch -> Englisch.
  // Eine gespeicherte Richtungswahl kann später ergänzt werden.
  current.reverse=false;

  document.getElementById("direction").textContent="Deutsch → Englisch";
  document.getElementById("question").textContent=current.de;
  typing.classList.remove("hidden");
  input.focus();
}

function normalizeAnswer(s){
  return s.trim().toLocaleLowerCase("de-DE").replace(/\s+/g," ");
}

function finishCurrent(ok){
  if(!current)return;

  if(ok){
    current.level=Math.min(6,(current.level||0)+1);
    const intervals=[0,1,2,4,7,14,30];
    current.next=days(intervals[current.level]);
  }else{
    current.level=Math.max(0,(current.level||0)-1);
    current.next=Date.now()+5*60000;
  }

  current.last=Date.now();
  save();
  renderStats();
  renderWords();
  pick();
}

function checkAnswer(){
  if(!current)return;

  const input=document.getElementById("answerInput");
  const feedback=document.getElementById("answerFeedback");
  const correct=document.getElementById("correctAnswer");
  const button=document.getElementById("checkAnswer");
  const given=input.value.trim();
  const expected=current.en.trim();

  if(!given){
    feedback.textContent="Bitte zuerst eine Antwort eingeben.";
    feedback.className="feedback";
    input.focus();
    return;
  }

  const isCorrect=normalizeAnswer(given)===normalizeAnswer(expected);

  // Das Eingabefeld wird nur für diese eine Prüfung gesperrt.
  // Beim nächsten Wort wird pick() ein neues, leeres Feld bereitstellen.
  input.disabled=true;
  button.classList.add("hidden");

  if(isCorrect){
    feedback.textContent="✓ Richtig!";
    feedback.className="feedback correct";
    correct.classList.add("hidden");

    // Bei einer richtigen Eingabe ist die Antwort automatisch gewusst.
    // Es gibt keine überflüssige "Habe ich gewusst?"-Frage.
    const next=document.createElement("button");
    next.className="good";
    next.textContent="Weiter";
    next.id="nextButton";
    document.getElementById("typingArea").appendChild(next);
    next.onclick=()=>finishCurrent(true);
  }else{
    feedback.textContent="✗ Falsch";
    feedback.className="feedback wrong";
    correct.textContent="Richtig wäre: "+expected;
    correct.classList.remove("hidden");

    // Bei einer falschen Eingabe gibt es nur noch die Entscheidung,
    // ob die Vokabel trotzdem gewusst wurde oder nicht.
    const actions=document.createElement("div");
    actions.className="actions";
    actions.id="resultActions";
    actions.innerHTML='<button class="bad" id="wrong">❌ Nicht gewusst</button><button class="good" id="right">✅ Doch gewusst</button>';
    document.getElementById("typingArea").appendChild(actions);

    document.getElementById("wrong").onclick=()=>finishCurrent(false);
    document.getElementById("right").onclick=()=>finishCurrent(true);
  }
}

function repeatAll(){
  const a=profile();
  if(!a.length){alert("Noch keine Vokabeln vorhanden.");return}
  a.forEach(x=>x.next=Date.now());
  save();renderStats();pick();
}

function renderWords(){
  const box=document.getElementById("wordList");
  box.innerHTML="";
  const a=profile();

  if(!a.length){
    box.innerHTML='<p class="small">Noch keine Vokabeln.</p>';
    return;
  }

  a.slice().reverse().forEach(x=>{
    const d=document.createElement("div");
    d.className="list";

    const info=document.createElement("div");
    info.innerHTML="<b>"+esc(x.de)+"</b> → "+esc(x.en);

    const b=document.createElement("button");
    b.className="secondary";
    b.textContent="Löschen";
    b.onclick=()=>{
      if(confirm("Vokabel löschen?")){
        data.profiles[data.current]=data.profiles[data.current].filter(v=>v.id!==x.id);
        save();renderStats();renderWords();pick();
      }
    };

    d.appendChild(info);d.appendChild(b);box.appendChild(d);
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function manageProfile(){
  const name=data.current;
  if(!data.profilePins)data.profilePins={};

  // Ältere Profile (z. B. Andi/Tochter) hatten noch keinen PIN.
  // Beim ersten Verwalten wird deshalb einmalig ein PIN festgelegt.
  if(!data.profilePins[name]){
    const pin=prompt(
      'Für das Profil "'+name+'" ist noch kein PIN hinterlegt.\n'+
      'Bitte jetzt einen 4-stelligen PIN festlegen:'
    );
    if(pin===null)return;
    if(!/^\d{4}$/.test(pin)){
      alert("Der PIN muss genau 4 Ziffern haben.");
      return;
    }
    data.profilePins[name]=pin;
    save();
    alert("PIN gespeichert. Öffne ⚙ erneut, um das Profil zu verwalten.");
    return;
  }

  const action=prompt(
    "Profil: "+name+
    "\n\n1 = PIN ändern\n2 = Profil löschen\n\nAbbrechen = zurück"
  );

  if(action==="1"){
    const old=prompt("Aktuellen PIN eingeben:");
    if(old!==data.profilePins[name]){
      alert("PIN ist falsch.");
      return;
    }
    const neu=prompt("Neuen 4-stelligen PIN eingeben:");
    if(!/^\d{4}$/.test(neu||"")){
      alert("Der PIN muss genau 4 Ziffern haben.");
      return;
    }
    data.profilePins[name]=neu;
    save();
    alert("PIN geändert.");
    return;
  }

  if(action==="2"){
    const pin=prompt('PIN für "'+name+'" eingeben:');
    if(pin!==data.profilePins[name]){
      alert("PIN ist falsch. Das Profil wurde nicht gelöscht.");
      return;
    }

    if(Object.keys(data.profiles).length<=1){
      alert("Das letzte Profil kann nicht gelöscht werden.");
      return;
    }

    if(!confirm(
      'Profil "'+name+'" wirklich löschen?\n\n'+
      'Alle Vokabeln und der Lernstand dieses Profils werden auf diesem Gerät gelöscht.'
    )) return;

    delete data.profiles[name];
    delete data.profilePins[name];
    data.current=Object.keys(data.profiles)[0];

    save();
    renderProfiles();
    renderStats();
    renderWords();
    pick();
    alert("Profil gelöscht.");
  }
}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  ["learn","add","words"].forEach(id=>{
    document.getElementById(id).classList.toggle("hidden",id!==b.dataset.tab);
  });
  if(b.dataset.tab==="words")renderWords();
});

document.getElementById("profile").onchange=e=>{
  data.current=e.target.value;
  save();renderStats();renderWords();pick();
};

document.getElementById("addProfile").onclick=addProfile;

// Langes Drücken/zweiter Button für Profilverwaltung ist bewusst schlicht:
const manageBtn=document.createElement("button");
manageBtn.className="secondary profileBtn";
manageBtn.textContent="⚙";
manageBtn.title="Profil verwalten";
manageBtn.onclick=manageProfile;
document.querySelector(".profileBox").appendChild(manageBtn);

document.getElementById("checkAnswer").onclick=checkAnswer;
document.getElementById("answerInput").addEventListener("keydown",e=>{
  if(e.key==="Enter")checkAnswer();
});
document.getElementById("repeatAll").onclick=repeatAll;

document.getElementById("addBtn").onclick=()=>{
  const de=document.getElementById("de").value.trim();
  const en=document.getElementById("en").value.trim();

  if(!de||!en){
    alert("Bitte Deutsch und Englisch eingeben.");
    return;
  }

  profile().push({
    id:uid(),
    de,
    en,
    level:0,
    next:Date.now()
  });

  save();
  document.getElementById("de").value="";
  document.getElementById("en").value="";
  renderStats();renderWords();
  alert("Vokabel gespeichert!");
};

renderProfiles();
renderStats();
renderWords();
pick();
</script>
</body>
</html>
